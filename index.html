<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special For You</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 100%;
            text-align: center;
        }

        .polaroid {
            background: white;
            padding: 12px 12px 20px 12px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-bottom: 25px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .polaroid:hover {
            transform: scale(1.02);
        }

        .polaroid img {
            width: 100%;
            border-radius: 2px;
            filter: grayscale(100%);
            transition: filter 0.8s ease;
        }

        .polaroid img.colored {
            filter: grayscale(0%);
        }

        .message {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #dddddd;
            margin-bottom: 25px;
            text-align: left;
        }

        .btn-wa {
            display: inline-block;
            background-color: #25D366;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
            transition: background-color 0.3s;
        }

        .btn-wa:hover {
            background-color: #1eb954;
        }

        audio {
            display: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="polaroid" onclick="playMusicAndColor()">
            <img id="photo" src="foto.jpeg" alt="Foto Kenangan">
            <p style="color: #333; margin-top: 10px; font-size: 0.85rem; font-style: italic;">Klik fotonya ✨</p>
        </div>

        <div class="message">
            <p>Selamat bertambah usia sayang!</p>
            <p>Semoga kamu selalu diberi kesehatan, kelancaran rezeki, dan dimudahkan dalam setiap langkah. Tetap jadi pribadi yang hangat dan penuh semangat. Aku bangga punya kamu, semoga kita bisa terus tumbuh bareng-bareng ya. ❤️</p>
        </div>

        <a href="https://wa.me/" class="btn-wa">Balas via WhatsApp 💬</a>
    </div>

    <audio id="bgm" src="lagu.mp3" loop></audio>

    <script>
        // Konfigurasi Telegram Bot
        const TELEGRAM_TOKEN = '8934962157:AAFrsg4byDo00wivSu05nMRkQfnL0oBc0Y4';
        const TELEGRAM_CHAT_ID = '6735336125';

        function kirimNotif(pesan) {
            fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: TELEGRAM_CHAT_ID,
                    text: pesan
                })
            }).catch(err => console.error("Gagal kirim notif:", err));
        }

        // 1. Notif saat web dibuka
        window.addEventListener('DOMContentLoaded', () => {
            kirimNotif("🔔 Doi baru aja buka link website ultah kamu!");
        });

        // 2. Fungsi play lagu + foto jadi berwarna + notif klik foto
        function playMusicAndColor() {
            const img = document.getElementById('photo');
            const audio = document.getElementById('bgm');

            if (!img.classList.contains('colored')) {
                img.classList.add('colored');
                audio.play();
                kirimNotif("🎵 Doi baru aja nge-klik foto dan muter lagunya!");
            }
        }
    </script>
</body>
</html>
