<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Animasi Perubahan Warna Background */
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Elemen Hati Melayang di Background */
    .bg-hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart-particle {
      position: absolute;
      bottom: -10%;
      color: rgba(255, 255, 255, 0.4);
      font-size: 20px;
      animation: floatUp 8s linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }
      20% { opacity: 0.7; }
      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    .container {
      width: 100%;
      max-width: 380px;
      position: relative;
      z-index: 2;
    }

    /* Animasi Masuk Card */
    .card {
      background: rgba(255, 255, 255, 0.90);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.5);
      padding: 25px 20px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
      text-align: center;
      animation: zoomIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes zoomIn {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* Animasi Goyang saat PIN Salah */
    .shake {
      animation: shake 0.4s ease-in-out;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-10px); }
      40%, 80% { transform: translateX(10px); }
    }

    h2 {
      color: #4a4a4a;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .clue {
      color: #666;
      font-size: 13px;
      font-style: italic;
      margin-bottom: 20px;
    }

    /* Bulatan PIN */
    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .dot {
      width: 16px;
      height: 16px;
      border: 2px solid #e73c7e;
      border-radius: 50%;
      transition: background 0.2s, transform 0.2s;
    }

    .dot.filled {
      background: #e73c7e;
      border-color: #e73c7e;
      transform: scale(1.1);
    }

    /* Keypad Tombol */
    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      max-width: 260px;
      margin: 0 auto;
    }

    .key {
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.05);
      padding: 15px 0;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
      color: #2f3542;
      cursor: pointer;
      transition: all 0.2s;
      width: 60px;
      height: 60px;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .key:active {
      background: #e73c7e;
      color: white;
      transform: scale(0.92);
    }

    .action-btn {
      display: inline-block;
      margin-top: 15px;
      padding: 12px 22px;
      background: linear-gradient(135deg, #e73c7e, #ee7752);
      color: white;
      text-decoration: none;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(231, 60, 126, 0.4);
      transition: 0.3s;
    }

    .action-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(231, 60, 126, 0.5);
    }

    /* Animasi Membesar & Mengecil (Pulse) Khusus Tombol Balas WA */
    .reply-btn {
      background: #25d366;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
      margin-top: 20px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7);
      }
      70% {
        transform: scale(1.08);
        box-shadow: 0 0 0 12px rgba(37, 211, 102, 0);
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(37, 211, 102, 0);
      }
    }

    .wa-btn-pop {
      background: #25d366;
      box-shadow: 0 4px 10px rgba(37, 211, 102, 0.3);
    }

    .photo-wrapper img {
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 15px;
      margin-bottom: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }

    h1 {
      color: #e73c7e;
      font-size: 20px;
      margin-bottom: 15px;
    }

    .typed-text {
      color: #333;
      font-size: 13.5px;
      line-height: 1.7;
      text-align: left;
      white-space: pre-line;
    }

    /* Modal / Pop Up Kustom */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      padding: 20px;
      animation: fadeIn 0.3s ease;
    }

    .modal-box {
      background: white;
      padding: 25px 20px;
      border-radius: 20px;
      text-align: center;
      max-width: 320px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-box p {
      font-size: 15px;
      color: #333;
      font-weight: 600;
      line-height: 1.5;
      margin-bottom: 15px;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes popUp {
      from { transform: scale(0.7); }
      to { transform: scale(1); }
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

    function pressKey(num) {

    function updateDots() {
      for (let i = 0; i < 4; i++) {

    function checkPin() {

    function typeWriter(text, elementId, speed, callback) {
      let index = 0;
      const element = document.getElementById(elementId);
      element.innerHTML = "";

      function type() {
        if (index < text.length) {
          element.innerHTML += text.charAt(index);
          index++;
          setTimeout(type, speed);
        } else if (callback) {
          callback();
        }
      }
      type();
    }
